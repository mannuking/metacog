# Phase 1 — RL on Tinker with verifiable metacognitive reward
# Frozen at the start of the run (per paper directory rules)
# Source: results\phase1\phase1_summary.json

model:
  base: "Qwen/Qwen3.6-35B-A3B"
  lora_rank: 32
  lora_seed: 0
  tokenizer_stop: ['<|im_end|>']

data:
  n_gsm8k: 25
  n_mmlu_pro: 25
  n_train_total: 50
  max_tokens: 500
  temperature: 1.0
  effort: "medium"

optimizer:
  name: adamw
  learning_rate: 1e-05
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-08
  weight_decay: 0.0
  grad_clip_norm: 1.0

rl:
  method: tinker_verifiable_reward
  loss_fn: "importance_sampling"
  group_size: 4
  kl_penalty_coef: 0.0
  n_steps: 20
  save_every: 5
  eval_every: 5
  eval_n_questions: 20
  eval_temperature: 0.0

reward:
  r_correct: 1.0
  r_correct_calibrated: 0.5
  r_abstain_humble: 0.3
  r_overconfident_wrong: -0.5
  r_humble_wrong: 0.0
  r_format_ok: 0.05
  r_unit_check: 0.02
  r_sanity_bounds: 0.02
  r_verify_conflict_penalty: -0.05
  r_calibration_weight: 0.2
  length_penalty_per_1k_tokens: 0.05
  max_length_penalty: 0.1
  abstain_confidence_threshold: 0.4
  r_abstain_wrong: 0.0
  r_abstain_correct: 0.0

checkpoints:
  - tinker://4ee43737-7dd5-5271-98bd-fd6f28370006:train:0/weights/phase1_step5
  - tinker://4ee43737-7dd5-5271-98bd-fd6f28370006:train:0/weights/phase1_step10
  - tinker://4ee43737-7dd5-5271-98bd-fd6f28370006:train:0/weights/phase1_step15
  - tinker://4ee43737-7dd5-5271-98bd-fd6f28370006:train:0/weights/phase1_step20
