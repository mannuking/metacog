[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metacog"
version = "0.1.0"
description = "Metacognition training for small open-weight models on Tinker"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jai kumar Meena" }]
keywords = ["metacognition", "calibration", "tinker", "qwen", "rl"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tinker>=0.1",
    "tinker-cookbook>=0.4",
    "datasets>=3.0",
    "transformers>=5.0",
    "torch>=2.0",
    "pydantic>=2.0",
    "tqdm>=4.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tinker", "data", "model", "eval", "scripts"]
